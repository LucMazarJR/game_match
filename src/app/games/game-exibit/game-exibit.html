<div class="flex justify-center items-center flex-col">
  @if (isLoading()) {
    <div class="text-primary items-center flex flex-col gap-4 min-h-[70vh] justify-center">
      <p class="font-medium text-2xl">Carregando...</p>
      <svg lucideLoaderCircle class="animate-spin" size="40"></svg>
    </div>
  } @else {
    @if (gameId.length != 0) {
      <div class="w-full relative">
        <div
          class="bg-center bg-cover bg-no-repeat min-h-[90vh]"
          [style.background-image]="
            gameData()?.background_image ? 'url(' + gameData()?.background_image + ')' : 'none'
          "
          [style.filter]="'grayscale(60%)'"
        ></div>
        <div class="absolute inset-0 w-full h-full bg-background/90"></div>
      </div>
    } @else {
      <h1 class="font-bold text-2xl mt-24">Jogo não encontrado...</h1>
    }
  }
</div>
