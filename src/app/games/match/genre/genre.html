<section class="genre-scroll w-full grid grid-cols-4 scroll-smooth gap-4 h-140 overflow-auto p-2">
    @for(genre of genres; track genre.genreId){
        <button 
            [class]="' h-66 rounded-lg flex flex-col justify-around items-center cursor-pointer transition-all ease-in-out hover:scale-105 ' + (selectedGenresIds().includes(genre.genreId) ? 'bg-primary/60 hover:bg-primary/80' : 'bg-muted/20 hover:bg-muted/30')"
            (click)="toggleGenre(genre.genreId)"
        >
            <p class="font-medium text-lg">{{ genre.name }}</p>
            <svg lucideIcon [lucideIcon]="getIcon(genre.lucideIcon)" size="48" aria-hidden="true" [class]="(selectedGenresIds().includes(genre.genreId) ? ' text-white' : 'text-muted/80')"></svg>
        </button>
    }
</section>
