<section class="genre-scroll w-full grid grid-cols-4 scroll-smooth gap-4 h-155 overflow-auto p-2">
    @for(genre of genres; track genre.gameId){
        <div class="bg-muted/20 h-72 rounded-lg flex flex-col justify-around items-center cursor-pointer transition-all ease-in-out hover:bg-muted/30 hover:scale-105">
            <p class="font-medium text-lg">{{ genre.name }}</p>
            <svg lucideIcon [lucideIcon]="getIcon(genre.lucideIcon)" size="48" aria-hidden="true" class="text-muted/80"></svg>
        </div>
    }
</section>
