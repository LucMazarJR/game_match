<section class="genre-scroll w-full grid grid-cols-4 scroll-smooth gap-4 h-155 overflow-auto px-2">
    @for(genre of genres; track genre.gameId){
        <div class="bg-muted/20 h-72 rounded-md flex flex-col justify-around items-center cursor-pointer">
            <p class="font-medium text-lg">{{ genre.name }}</p>
            <svg lucideIcon [lucideIcon]="getIcon(genre.lucideIcon)" size="48" aria-hidden="true" class="text-muted/80"></svg>
        </div>
    }
</section>
