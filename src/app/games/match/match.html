<div class="flex flex-col p-6 items-center gap-6">
  <div class="space-y-4 text-center">
    <p class="text-primary/40">Selecione as opções para encontrar seu jogo ideal</p>
    <h1 class="font-bold text-5xl">O que você busca hoje?</h1>
  </div>
  <div class="w-[70%] flex flex-col gap-8">
    @if (formPage() == 0) {
      <app-genre
        [selectedGenreIds]="formApiData().selectedGenreIds"
        (selectedGenresChange)="onSelectedGenresChange($event)"
      ></app-genre>
    } @else {
      <app-form
        [selectedPlataformIds]="formApiData().selectedPlataformIds"
        [selectedStoreIds]="formApiData().selectedStoreIds"
        (selectedPlataformsChange)="onSelectedPlataformsChange($event)"
        (selectedStoresChange)="onSelectedStoresChange($event)"
      >
      </app-form>
    }
    <div class="flex justify-between">
      @if (formPage() == 1) {
        <button
          class="w-fit justify-end bg-muted/90 py-2 px-6 rounded-lg text-background border-2 border-muted/20 text-lg transition-all hover:bg-muted/60 cursor-pointer"
          (click)="formPage.update(prev => prev - 1)"
        >
          Voltar
        </button>
      } @else {
        <div></div>
      }
      <button
        class="w-fit justify-end bg-primary py-2 px-6 rounded-lg text-background border-2 border-primary/20 text-lg transition-all hover:bg-primary/80 cursor-pointer"
        (click)="formPage.update(prev => prev === 0 ? prev + 1 : prev)"
      >
        Continuar
      </button>
    </div>
  </div>
</div>
